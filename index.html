'use strict';const DB='payment-tax-v1',STORES=['installments','taxMasters','taxYears','taxBills','cards','cardPeriods','transactions','attachments','audit','meta'];let db,tab='home',data={};const $=s=>document.querySelector(s),id=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('sv-SE'),money=n=>'NT$ '+(Math.round(Number(n)||0)).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Math.round(Number(v)||0),dateAdd=(d,n,unit)=>{let x=new Date(d+'T12:00:00');if(unit==='week')x.setDate(x.getDate()+n*7);else {const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n*({month:1,quarter:3,year:12}[unit]||1));x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}return x.toLocaleDateString('sv-SE')},monthDay=(year,month,day)=>`${year}-${String(month).padStart(2,'0')}-${String(Math.min(day,new Date(year,month,0).getDate())).padStart(2,'0')}`;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function tx(store,mode='readonly'){return db.transaction(Array.isArray(store)?store:[store],mode)}function all(store){return new Promise((resolve,reject)=>{const r=tx(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function get(store,key){return new Promise((resolve,reject)=>{const r=tx(store).objectStore(store).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function put(store,obj){return new Promise((resolve,reject)=>{const t=tx(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=()=>resolve();t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}function batch(store,items){return new Promise((resolve,reject)=>{const t=tx(store,'readwrite');for(const o of items)t.objectStore(store).put(o);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}async function audit(kind,ref,detail){await put('audit',{id:id(),kind,ref,detail,at:new Date().toISOString()})}async function save(store,obj,detail){const old=await get(store,obj.id);await put(store,obj);if(store==='transactions'||(old&&['taxBills','taxMasters','cards','installments'].includes(store)&&detail&&/歸檔|取消|恢復|結清|核對|門檻/.test(detail)))await audit(store,obj.id,{action:old?'update':'create',old:old||null,new:obj,reason:detail||''});await refresh()}async function refresh(){for(const s of STORES)data[s]=await all(s);render()}function items(store,field,val){return data[store].filter(x=>x[field]===val)}function paid(kind,ref){return items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='payment'&&x.status!=='failed').reduce((a,x)=>a+x.amount,0)-items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='refund').reduce((a,x)=>a+x.amount,0)}function verified(kind,ref){return items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='payment'&&x.status==='verified').reduce((a,x)=>a+x.amount,0)-items('transactions','parentId',ref).filter(x=>x.parentType===kind&&x.type==='refund'&&x.status==='verified').reduce((a,x)=>a+x.amount,0)}function status(amount,p,v){return amount<=0?'免繳':p<=0?'未繳':p<amount?'部分繳款':v<p?'待核對':'已核對'}function tag(s){return `<span class="tag ${['已核對','已達標','已結清','免繳'].includes(s)?'ok':['已逾期','未達標'].includes(s)?'bad':'warn'}">${esc(s)}</span>`}function btn(text,action,kind=''){return `<button class="${kind}" onclick="${action}">${text}</button>`}function showDialog(title,body){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=body;$('#dialog').showModal()}function closeDialog(){$('#dialog').close()}function field(label,name,type='text',value='',required=true,extra=''){return `<div><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}function sel(label,name,options,value){return `<div><label>${label}</label><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`}function formWrap(inner,handler){return `<form onsubmit="event.preventDefault();${handler}(this)"><div class="fields">${inner}</div><div class="actions"><button class="primary" type="submit">儲存</button><button type="button" onclick="closeDialog()">取消</button></div></form>`}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}$('#tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)};
function render(){const view=$('#view');if(!view)return;view.innerHTML=({home:homeView,installments:installView,taxes:taxView,cards:cardView,history:historyView,archive:archiveView,settings:settingsView}[tab])()}function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}function noData(s){return `<div class="empty">${s}</div>`}
function homeView(){let dues=[],total=0,paidTotal=0,unverified=0;for(const inst of data.installments.filter(x=>!x.archived)){const entries=inst.periods||[];for(const p of entries){if(p.closed)continue;const a=paid('installment',p.id),v=verified('installment',p.id);total+=Math.max(0,p.amount-a);paidTotal+=a;unverified+=Math.max(0,a-v);if(a<p.amount&&p.due)dues.push({title:inst.name+' 第'+p.n+'期',date:p.due,kind:'分期'})}}for(const bill of data.taxBills.filter(x=>taxBillVisible(x)&&x.amount!==null&&x.amount!==undefined&&x.state!=='exempt')){const a=paid('tax',bill.id),v=verified('tax',bill.id);total+=Math.max(0,bill.amount-a);paidTotal+=a;unverified+=Math.max(0,a-v);if(a<bill.amount&&bill.due)dues.push({title:bill.name,date:bill.due,kind:'稅務'})}let credit=[];for(const p of data.cardPeriods){const c=data.cards.find(x=>x.id===p.cardId);if(!c||c.archived||!c.active)continue;const effective=cardEffective(p.id),gap=Math.max(0,p.target-effective);if(gap>0&&p.end>=today()&&daysUntil(p.end)<=7)credit.push({name:c.name,date:p.end,gap})}const notices=dues.filter(x=>daysUntil(x.date)<=7).sort((a,b)=>a.date.localeCompare(b.date));const missing=data.taxBills.filter(x=>taxBillVisible(x)&&x.amount==null&&x.state!=='exempt').length;const last=(data.meta.find(x=>x.id==='lastBackup')||{}).value;const backupOld=!last||daysUntil(last.slice(0,10))< -30;return `<h2>今日總覽</h2><div class="grid"><div class="stat">確定待繳金額<strong>${money(total)}</strong></div><div class="stat">累計淨付款<strong>${money(paidTotal)}</strong></div><div class="stat">待核對金額<strong>${money(unverified)}</strong></div><div class="stat">待填稅額<strong>${missing} 筆</strong></div></div>${backupOld?`<div class="card note">⚠️ ${last?'已超過 30 天未備份':'尚未建立完整備份'}。請至「備份設定」下載資料。</div>`:''}${card('即將到期與逾期',notices.length?notices.map(x=>`<div class="item row"><span>${esc(x.title)} <small>(${x.kind})</small></span><span>${esc(x.date)} ${tag(daysUntil(x.date)<0?'已逾期':'即將到期')}</span></div>`).join(''):noData('目前沒有 7 天內到期或逾期的未繳項目'))}${card('信用卡消費提醒',credit.length?credit.map(x=>`<div class="item row"><span>${esc(x.name)}<br><small>最後刷卡日 ${x.date}</small></span><strong>尚差 ${money(x.gap)}</strong></div>`).join(''):noData('目前沒有需要提醒的信用卡消費門檻'))}<p class="muted">提醒僅在開啟 App 時顯示；未知稅額不列入金額統計。</p>`}
function daysUntil(d){return Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}
function installView(){return `<div class="section-title"><h2>分期繳款</h2>${btn('＋ 新增分期','editInstall()','primary')}</div>${data.installments.filter(x=>!x.archived).map(x=>{const periods=x.periods||[],sum=periods.reduce((a,p)=>a+p.amount,0),rem=periods.reduce((a,p)=>a+(p.closed?0:Math.max(0,p.amount-paid('installment',p.id))),0);return card(`${esc(x.name)} ${tag(rem===0?'已結清':'進行中')}`,`<div class="row"><span>原始 ${money(x.original)} ／ 調整後 ${money(sum)}</span><strong>剩餘 ${money(rem)}</strong></div><p class="muted">${periods.length} 期｜${esc(x.cycle)}｜${esc(x.note||'')}</p><div class="actions">${btn('查看期數',`showPeriods('${x.id}')`)}${btn('修改分期',`editInstall('${x.id}')`)}${btn('提前結清',`settleInstall('${x.id}')`)}${btn('歸檔',`archive('installments','${x.id}')`)}</div>`)}).join('')||noData('尚未建立分期資料')}`}
function editInstall(key){const x=data.installments.find(v=>v.id===key);showDialog(x?'修改分期':'新增分期',formWrap(field('分期名稱','name','text',x?.name||'')+(!x?field('總期數','count','number',12,true,'min="1" max="360"'):'')+(!x?sel('金額輸入方式','mode',[['total','輸入總金額'],['each','輸入每期金額']],'total'):'')+(!x?field('金額（新台幣）','amount','number','',true,'min="1" step="1"'):'')+(!x?field('首期繳款日','start','date',today()):'')+sel('繳款週期','cycle',[['week','每週'],['month','每月'],['quarter','每季'],['year','每年']],x?.cycle||'month')+field('備註','note','text',x?.note||'',false),`saveInstall(this,'${key||''}')`))}async function saveInstall(f,key){const v=Object.fromEntries(new FormData(f));let x=data.installments.find(z=>z.id===key);if(x){x={...x,name:v.name,cycle:v.cycle,note:v.note}}else{const count=+v.count,amount=num(v.amount);if(count<1||amount<1)return alert('請輸入有效金額及期數');const total=v.mode==='total'?amount:amount*count,base=Math.floor(total/count),periods=Array.from({length:count},(_,i)=>({id:id(),n:i+1,due:dateAdd(v.start,i,v.cycle),amount:i===count-1?total-base*(count-1):base,closed:false}));x={id:id(),name:v.name,cycle:v.cycle,original:total,periods,note:v.note,created:today(),archived:false}}await save('installments',x);closeDialog()}
function showPeriods(key){const x=data.installments.find(v=>v.id===key);showDialog(x.name,`<p>原始總額 ${money(x.original)}。已付款的期數不可直接修改金額。</p><div class="table-wrap"><table><thead><tr><th>期數</th><th>到期</th><th>應繳</th><th>淨付款</th><th>狀態</th><th>操作</th></tr></thead><tbody>${x.periods.map(p=>{const a=paid('installment',p.id),v=verified('installment',p.id);return `<tr><td>${p.n}</td><td>${p.due}</td><td>${money(p.amount)}</td><td>${money(a)}</td><td>${p.closed?tag('已結清'):tag(status(p.amount,a,v))}</td><td>${!p.closed?btn('付款',`openPayment('installment','${p.id}','${esc(x.name)} 第${p.n}期')`):''}${!p.closed?btn('調整',`editPeriod('${key}','${p.id}')`):''}</td></tr>`}).join('')}</tbody></table></div>`)}function editPeriod(instId,periodId){const x=data.installments.find(v=>v.id===instId),p=x.periods.find(v=>v.id===periodId);if(paid('installment',periodId)!==0)return alert('已有付款的期數不可直接修改金額。');showDialog('修改第 '+p.n+' 期',formWrap(field('應繳金額','amount','number',p.amount,true,'min="0"')+field('到期日','due','date',p.due)+field('修改原因','reason','text','',true),`savePeriod(this,'${instId}','${periodId}')`))}async function savePeriod(f,instId,pid){const v=Object.fromEntries(new FormData(f)),x=data.installments.find(z=>z.id===instId),p=x.periods.find(z=>z.id===pid);const old=p.amount;p.amount=num(v.amount);p.due=v.due;if(!confirm(`原始總額保留 ${money(x.original)}；本期 ${money(old)} 改為 ${money(p.amount)}。確定？`))return;await save('installments',x,v.reason);closeDialog()}function settleInstall(key){const x=data.installments.find(v=>v.id===key);const remaining=x.periods.filter(p=>!p.closed).reduce((s,p)=>s+Math.max(0,p.amount-paid('installment',p.id)),0);showDialog('提前結清',`<p>目前剩餘應繳 ${money(remaining)}。結清後保留原期數。</p>`+formWrap(field('實際結清付款金額','amount','number',remaining,true,'min="0"')+field('結清日期','date','date',today())+field('結清原因／折讓說明','reason','text','提前結清',true),`saveSettlement(this,'${key}')`))}async function saveSettlement(f,key){const v=Object.fromEntries(new FormData(f)),x=data.installments.find(z=>z.id===key),open=x.periods.filter(p=>!p.closed);if(!open.length)return;const due=open.reduce((s,p)=>s+Math.max(0,p.amount-paid('installment',p.id)),0),amt=num(v.amount);if(amt>due||amt<0)return alert('結清金額必須介於 0 與剩餘應繳金額之間');if(!confirm(`結清付款 ${money(amt)}，折讓 ${money(due-amt)}，確定結清？`))return;const p=open[0];let transactionId=null;if(amt){transactionId=id();await put('transactions',{id:transactionId,parentType:'installment',parentId:p.id,type:'payment',amount:amt,date:v.date,status:'pending',method:'其他',note:'提前結清：'+v.reason})}x.settlement={amount:amt,discount:due-amt,date:v.date,reason:v.reason,transactionId,verified:amt===0};if(amt===0)x.periods.forEach(q=>{if(!q.closed){q.closed=true;q.closedReason='提前結清';q.closedAt=v.date}});await save('installments',x,'提前結清；結清付款待核對');closeDialog();alert(amt?'已登記結清付款，請至歷史頁面核對後才會完成結清。':'已記錄零元提前結清。')}
const taxPresets=[['使用牌照稅（自用小客車）',4],['房屋稅',5],['綜合所得稅',5],['汽車燃料使用費（自用車）',7],['地價稅',11]];function taxBillVisible(b){return !b.archived&&b.state!=='cancelled'&&!data.taxMasters.find(m=>m.id===b.masterId)?.archived}
function taxView(){return `<div class="section-title"><h2>週期性稅務</h2>${btn('＋ 新增稅務','editTaxMaster()','primary')}</div><p class="note">預設月份僅供參考，實際期限依稅單為準。已取消的稅單不列入待繳統計。</p>${data.taxMasters.filter(x=>!x.archived).map(m=>{const years=items('taxYears','masterId',m.id).sort((a,b)=>b.year-a.year);return card(`${esc(m.name)}｜${esc(m.object)} ${m.active?tag('啟用'):tag('停用')}`,`<p class="muted">預計月份：${m.month} 月｜年度項目 ${years.length} 筆</p><div class="actions">${btn('新增稅單',`editBill('${m.id}')`)}${btn('補建年度',`catchupTax('${m.id}')`)}${btn(m.active?'停用':'啟用',`toggleTax('${m.id}')`)}${btn('歸檔',`archive('taxMasters','${m.id}')`)}</div>${years.map(y=>`<details><summary>${y.year} 年度｜${items('taxBills','yearId',y.id).length} 張稅單</summary>${items('taxBills','yearId',y.id).map(b=>{const p=paid('tax',b.id),v=verified('tax',b.id),cancel=b.state==='cancelled';return `<div class="item"><div class="row"><strong>${esc(b.name)}</strong>${tag(cancel?'已取消':b.state==='exempt'?'免繳':b.amount==null?'金額待填':status(b.amount,p,v))}</div><small>應繳 ${b.amount==null?'待填':money(b.amount)}｜期限 ${esc(b.due||'待確認')}</small><div class="actions">${!cancel?btn('修改稅單',`editBill('${m.id}','${b.id}')`):''}${!cancel&&b.state!=='exempt'&&b.amount!=null?btn('登記付款',`openPayment('tax','${b.id}','${esc(b.name)}')`):''}${cancel?btn('恢復稅單',`restoreBill('${b.id}')`):btn('取消稅單',`cancelBill('${b.id}')`,'danger')}${btn('操作紀錄',`recordLog('taxBills','${b.id}')`)}</div></div>`}).join('')||'<p class="muted">尚無實際稅單</p>'}</details>`).join('')}`)}).join('')||noData('尚未建立稅務主檔')}`}
function editTaxMaster(){showDialog('新增稅務主檔',formWrap(sel('預設稅務名稱','preset',[['custom','自行輸入'],...taxPresets.map(([n])=>[n,n])],'custom')+field('自訂名稱（選自訂時必填）','custom','text','',false)+field('課稅對象（例如房屋 A）','object')+sel('繳納週期','cycle',[['year','每年'],['half','每半年'],['quarter','每季'],['month','每月']],'year')+field('預計月份（1～12）','month','number','5',true,'min="1" max="12"'),`saveTaxMaster(this)`))}async function saveTaxMaster(f){const v=Object.fromEntries(new FormData(f));const name=v.preset==='custom'?v.custom.trim():v.preset;if(!name)return alert('請填寫稅務名稱');const m={id:id(),name,object:v.object,cycle:v.cycle,month:+v.month,active:true,archived:false};await save('taxMasters',m);await createTaxYear(m,new Date().getFullYear());await createTaxYear(m,new Date().getFullYear()+1);await refresh();closeDialog()}async function createTaxYear(m,year){if(data.taxYears.some(x=>x.masterId===m.id&&x.year===year))return;await put('taxYears',{id:id(),masterId:m.id,year,created:today()});await audit('taxYears',m.id,{action:'auto-year',year})}async function ensureTaxYears(){const y=new Date().getFullYear();for(const m of data.taxMasters.filter(x=>x.active&&!x.archived)){for(const year of [y,y+1])if(!data.taxYears.some(x=>x.masterId===m.id&&x.year===year))await createTaxYear(m,year)}}async function catchupTax(mid){const m=data.taxMasters.find(x=>x.id===mid),y=new Date().getFullYear();const years=Array.from({length:6},(_,i)=>y-5+i).filter(year=>!data.taxYears.some(x=>x.masterId===mid&&x.year===year));if(!years.length)return alert('最近六年沒有缺少的年度。');if(!confirm(`將補建 ${years.join('、')} 年度的待確認項目，不會自動建立稅單。確定？`))return;for(const year of years)await createTaxYear(m,year);await refresh()}async function toggleTax(mid){const m=data.taxMasters.find(x=>x.id===mid);m.active=!m.active;await save('taxMasters',m)}function editBill(mid,bid){const m=data.taxMasters.find(x=>x.id===mid),b=data.taxBills.find(x=>x.id===bid);const years=items('taxYears','masterId',mid);showDialog(b?'修改稅單':'新增實際稅單',formWrap(sel('稅務年度','yearId',years.sort((a,b)=>b.year-a.year).map(x=>[x.id,x.year+' 年']),b?.yearId||years.find(x=>x.year===new Date().getFullYear())?.id)+field('稅單名稱','name','text',b?.name||m.name)+field('稅單識別碼／期別','code','text',b?.code||'',false)+field('應繳金額（未知可留空）','amount','number',b?.amount??'',false,'min="0"')+field('實際截止日','due','date',b?.due||'',false)+sel('稅單狀態','state',[['normal','一般應繳'],['exempt','本年度免繳']],'normal'===b?.state?'normal':b?.state||'normal')+field('備註／免繳原因','note','text',b?.note||'',false),`saveBill(this,'${mid}','${bid||''}')`))}async function saveBill(f,mid,bid){const v=Object.fromEntries(new FormData(f)),old=data.taxBills.find(x=>x.id===bid);if(v.state==='exempt'&&!v.note.trim())return alert('免繳請填寫原因');const b={id:bid||id(),masterId:mid,yearId:v.yearId,name:v.name,code:v.code,amount:v.amount===''?null:num(v.amount),due:v.due,state:v.state,note:v.note,archived:false};if(data.taxBills.some(x=>x.id!==bid&&x.yearId===v.yearId&&x.masterId===mid&&v.code&&x.code===v.code))return alert('此年度的稅單識別碼／期別已存在');if(old&&old.state==='cancelled')return alert('已取消的稅單請先恢復');if(old&&paid('tax',bid)!==0&&(old.amount!==b.amount||old.state!==b.state))return alert('已有付款紀錄，請先確認付款及核對狀態，不能直接修改應繳金額。');if(old){b.lifecycle=old.lifecycle||[];b.archived=old.archived||false}await save('taxBills',b);closeDialog()}
function cardPeriodDates(year,month,startDay,offset){const end=monthDay(year,month,11);let startYear=year,startMonth=month-offset;while(startMonth<1){startMonth+=12;startYear--}return {start:monthDay(startYear,startMonth,startDay),end}}function cardView(){return `<div class="section-title"><h2>信用卡消費門檻</h2>${btn('＋ 新增信用卡','editCard()','primary')}</div><p class="note">以刷卡交易日判斷期間。只有手動確認符合銀行規定的消費，才計入正式達標金額。</p>${data.cards.filter(x=>!x.archived).map(c=>card(`${esc(c.name)} ${c.active?tag('啟用'):tag('停用')}`,`<p>每期最低消費 ${money(c.target)}｜單數月 11 日截止｜起始：前 ${c.offset} 個月 ${c.startDay} 日</p><div class="actions">${btn('新增消費',`editCardSpend('${c.id}')`)}${btn('查看消費期',`showCardPeriods('${c.id}')`)}${btn('調整門檻',`changeCardTarget('${c.id}')`)}${btn('歸檔',`archive('cards','${c.id}')`)}</div>${items('cardPeriods','cardId',c.id).sort((a,b)=>b.end.localeCompare(a.end)).slice(0,3).map(p=>{const eff=cardEffective(p.id);return `<div class="item row"><span>${p.start} ～ ${p.end}<br><small>已認列 ${money(eff)}／門檻 ${money(p.target)}</small></span>${tag(eff>=p.target?'已達標':p.end<today()?'未達標':'尚未達標')}</div>`}).join('')}`)).join('')||noData('尚未建立信用卡資料')}`}
function editCard(){showDialog('新增信用卡',formWrap(field('信用卡名稱（勿輸入完整卡號）','name')+field('每期最低消費額','target','number','3000',true,'min="1"')+field('前幾個月開始（例：前 1 個月）','offset','number','1',true,'min="0" max="2"')+field('起始日（1～28）','startDay','number','12',true,'min="1" max="28"'),`saveCard(this)`))}async function saveCard(f){const v=Object.fromEntries(new FormData(f));const c={id:id(),name:v.name,target:num(v.target),offset:+v.offset,startDay:+v.startDay,active:true,archived:false,createdAt:today()};if(c.target<=0)return alert('最低消費額須大於零');await save('cards',c);await createCardPeriods(c);await refresh();closeDialog()}async function createCardPeriods(c){const y=new Date().getFullYear();const anchor=c.createdAt||null;const floor=anchor?dateAdd(anchor.slice(0,7)+'-01',-1,'month'):null;const existing=new Set(data.cardPeriods.filter(p=>p.cardId===c.id).map(p=>p.end));const pending=[];for(const year of [y-1,y,y+1])for(const month of [1,3,5,7,9,11]){const dates=cardPeriodDates(year,month,c.startDay,c.offset);if(floor&&dates.end<floor)continue;if(!floor&&dates.end<dateAdd(today().slice(0,7)+'-01',-1,'month'))continue;if(existing.has(dates.end))continue;existing.add(dates.end);pending.push({id:id(),cardId:c.id,year,month,start:dates.start,end:dates.end,target:c.target,created:today()})}if(pending.length)await batch('cardPeriods',pending)}
function cardEffective(pid){const spends=data.transactions.filter(x=>x.parentType==='card'&&x.parentId===pid);return spends.filter(x=>x.type==='spend'&&x.status==='verified').reduce((s,x)=>s+x.amount,0)-spends.filter(x=>x.type==='refund').reduce((s,x)=>s+x.amount,0)}function showCardPeriods(cid){const c=data.cards.find(x=>x.id===cid),periods=items('cardPeriods','cardId',cid).sort((a,b)=>b.end.localeCompare(a.end));showDialog(c.name+'｜消費期',periods.map(p=>`<div class="item"><strong>${p.start} ～ ${p.end}</strong> ${tag(cardEffective(p.id)>=p.target?'已達標':p.end<today()?'未達標':'尚未達標')}<p>最低 ${money(p.target)}｜已認列 ${money(cardEffective(p.id))}｜尚差 ${money(Math.max(0,p.target-cardEffective(p.id)))}</p>${btn('登記消費',`editCardSpend('${cid}','${p.id}')`)}${btn('查看交易',`showCardTx('${p.id}')`)}</div>`).join(''))}function editCardSpend(cid,pid){const c=data.cards.find(x=>x.id===cid),periods=items('cardPeriods','cardId',cid).sort((a,b)=>b.end.localeCompare(a.end));showDialog('登記信用卡消費',formWrap(sel('消費期','period',periods.map(p=>[p.id,`${p.start} ～ ${p.end}`]),pid||periods.find(p=>p.start<=today()&&p.end>=today())?.id||periods[0]?.id)+field('實際刷卡日','date','date',today())+field('消費金額','amount','number','',true,'min="1"')+field('商店名稱','merchant','text','',false)+sel('銀行認列確認','status',[['pending','待確認'],['verified','已確認符合'],['excluded','不符合']],'pending')+field('備註','note','text','',false),`saveCardSpend(this,'${cid}')`))}async function saveCardSpend(f,cid){const v=Object.fromEntries(new FormData(f)),p=data.cardPeriods.find(x=>x.id===v.period);if(v.date<p.start||v.date>p.end)return alert('刷卡日不在所選消費期內。請選擇正確期間。');await save('transactions',{id:id(),parentType:'card',parentId:p.id,type:'spend',amount:num(v.amount),date:v.date,status:v.status,merchant:v.merchant,note:v.note,cardId:cid});closeDialog()}function showCardTx(pid){const p=data.cardPeriods.find(x=>x.id===pid);showDialog('信用卡消費紀錄',items('transactions','parentId',pid).filter(x=>x.parentType==='card').map(t=>`<div class="item"><div class="row"><span>${esc(t.date)}｜${esc(t.merchant||t.type)}</span><strong>${t.type==='refund'?'-':'+'}${money(t.amount)}</strong></div><small>${esc(t.status)} ${esc(t.note||'')}</small><div class="actions">${t.type==='spend'?btn('認列狀態',`changeSpendStatus('${t.id}')`):''}${t.type==='spend'?btn('退款',`refundCard('${t.id}')`):''}${btn('憑證',`attachmentsDialog('${t.id}')`)}</div></div>`).join('')||noData('尚無交易'))}function changeSpendStatus(tid){const t=data.transactions.find(x=>x.id===tid);showDialog('修改認列狀態',formWrap(sel('認列狀態','status',[['pending','待確認'],['verified','已確認符合'],['excluded','不符合']],t.status)+field('修改原因','reason','text','',true),`saveSpendStatus(this,'${tid}')`))}async function saveSpendStatus(f,tid){const v=Object.fromEntries(new FormData(f)),t=data.transactions.find(x=>x.id===tid);t.status=v.status;await save('transactions',t,v.reason);closeDialog()}function refundCard(tid){const t=data.transactions.find(x=>x.id===tid),existing=data.transactions.filter(x=>x.type==='refund'&&x.originalId===tid).reduce((s,x)=>s+x.amount,0);showDialog('信用卡退款',formWrap(field('退款金額（剩餘可退 '+money(t.amount-existing)+'）','amount','number',t.amount-existing,true,`min="1" max="${t.amount-existing}"`)+field('退款日期','date','date',today())+field('退款原因','reason','text','',true),`saveCardRefund(this,'${tid}')`))}async function saveCardRefund(f,tid){const v=Object.fromEntries(new FormData(f)),t=data.transactions.find(x=>x.id===tid),prev=data.transactions.filter(x=>x.type==='refund'&&x.originalId===tid).reduce((s,x)=>s+x.amount,0);if(num(v.amount)<=0||num(v.amount)>t.amount-prev)return alert('退款金額不正確');await save('transactions',{id:id(),parentType:'card',parentId:t.parentId,originalId:tid,type:'refund',amount:num(v.amount),date:v.date,status:'verified',note:v.reason});closeDialog()}function changeCardTarget(cid){const c=data.cards.find(x=>x.id===cid);showDialog('調整最低消費額',formWrap(field('新最低消費額','target','number',c.target,true,'min="1"')+field('修改原因','reason','text','',true),`saveCardTarget(this,'${cid}')`))}async function saveCardTarget(f,cid){const v=Object.fromEntries(new FormData(f)),c=data.cards.find(x=>x.id===cid);c.target=num(v.target);const next=items('cardPeriods','cardId',cid).filter(x=>x.start>today());for(const p of next){p.target=c.target;await put('cardPeriods',p)}await save('cards',c,v.reason);closeDialog()}
function openPayment(kind,ref,title){showDialog('登記付款｜'+title,formWrap(field('實際付款日期','date','date',today())+field('付款金額','amount','number','',true,'min="1"')+sel('付款方式','method',[['現金','現金'],['信用卡','信用卡'],['轉帳','轉帳'],['行動支付','行動支付'],['其他','其他']],'轉帳')+sel('付款狀態','status',[['pending','已付款，待核對'],['failed','付款失敗']],'pending')+field('備註','note','text','',false),`savePayment(this,'${kind}','${ref}')`))}async function savePayment(f,kind,ref){const v=Object.fromEntries(new FormData(f));if(num(v.amount)<=0)return alert('金額須大於零');await save('transactions',{id:id(),parentType:kind,parentId:ref,type:'payment',amount:num(v.amount),date:v.date,status:v.status,method:v.method,note:v.note});closeDialog()}
let historyFilter='all',historyQuery='';
function txLabel(t){if(t.parentType==='installment'){const m=data.installments.find(x=>(x.periods||[]).some(p=>p.id===t.parentId));const p=m?.periods?.find(p=>p.id===t.parentId);return (m?.name||'分期')+(p?' 第'+p.n+'期':'')}if(t.parentType==='tax'){const b=data.taxBills.find(x=>x.id===t.parentId);return b?.name||'稅務'}if(t.parentType==='card'){const p=data.cardPeriods.find(x=>x.id===t.parentId);const c=data.cards.find(x=>x.id===(t.cardId||p?.cardId));return (c?.name||'信用卡')+(p?' '+p.start+'～'+p.end:'')}return ''}
function historyList(){return data.transactions.filter(t=>(historyFilter==='all'||t.parentType===historyFilter)&&[t.date,t.amount,t.note,t.method,t.merchant,t.type,t.status,txLabel(t)].join(' ').toLowerCase().includes(historyQuery.toLowerCase())).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function historyView(){return `<h2>付款與消費歷史</h2><div class="card"><div class="fields">${sel('類別','filterType',[['all','全部'],['installment','分期'],['tax','稅務'],['card','信用卡']],historyFilter)}${field('搜尋日期、名稱或備註','searchHistory','search',historyQuery,false)}</div><div class="actions">${btn('清除搜尋條件','clearHistory()')}${btn('匯出 CSV','exportCSV()')}${btn('匯出交易 PDF',"exportPDF('history')")}</div><div id="historyRows">${historyRows(historyList())}</div></div>`}
function historyRows(list){return list.map(t=>`<div class="item"><div class="row"><span>${esc(t.date)}｜${esc(txLabel(t))}｜${esc(t.type==='payment'?'付款':t.type==='refund'?'退款':t.type==='spend'?'消費':t.type)}</span><strong>${money(t.amount)}</strong></div><small>${esc(t.method||t.merchant||'')}｜${esc(t.status)}｜${esc(t.note||'')}</small><div class="actions">${t.parentType!=='card'&&t.type==='payment'?btn(t.status==='verified'?'取消核對':'核對付款',`toggleVerify('${t.id}')`):''}${t.parentType!=='card'&&t.type==='payment'?btn('退款',`refundPayment('${t.id}')`):''}${btn('附件',`attachmentsDialog('${t.id}')`)}</div></div>`).join('')||noData('沒有符合條件的紀錄')}
function updateHistoryRows(){const el=$('#historyRows');if(el)el.innerHTML=historyRows(historyList())}
function clearHistory(){historyFilter='all';historyQuery='';render()}
document.addEventListener('input',e=>{if(e.target.name==='searchHistory'){historyQuery=e.target.value;updateHistoryRows()}});

async function toggleVerify(tid){const t=data.transactions.find(x=>x.id===tid);if(t.status==='verified'){if(!confirm('確定取消核對？異動歷史將保留。'))return;t.status='pending'}else{if(t.status==='failed')return alert('失敗付款不可核對');t.status='verified'}await save('transactions',t,'核對狀態變更');for(const x of data.installments){if(x.settlement?.transactionId===tid){const done=t.status==='verified';x.settlement.verified=done;x.periods.forEach(p=>{p.closed=done;p.closedReason=done?'提前結清':'';p.closedAt=done?x.settlement.date:null});await save('installments',x,'結清核對狀態變更')}}}function refundPayment(tid){const t=data.transactions.find(x=>x.id===tid),used=data.transactions.filter(x=>x.originalId===tid&&x.type==='refund').reduce((s,x)=>s+x.amount,0);showDialog('登記退款',formWrap(field('退款金額','amount','number',t.amount-used,true,`min="1" max="${t.amount-used}"`)+field('退款日期','date','date',today())+field('退款原因','reason','text','',true),`savePaymentRefund(this,'${tid}')`))}async function savePaymentRefund(f,tid){const v=Object.fromEntries(new FormData(f)),t=data.transactions.find(x=>x.id===tid),used=data.transactions.filter(x=>x.originalId===tid&&x.type==='refund').reduce((s,x)=>s+x.amount,0);if(num(v.amount)<1||num(v.amount)>t.amount-used)return alert('退款金額不正確');await save('transactions',{id:id(),parentType:t.parentType,parentId:t.parentId,originalId:tid,type:'refund',amount:num(v.amount),date:v.date,status:'pending',note:v.reason});closeDialog()}

// Self-contained ZIP (stored entries, no third-party CDN; offline-capable).
const encoder=new TextEncoder(),decoder=new TextDecoder();function crc32(bytes){let c=-1;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=c&1?(c>>>1)^0xedb88320:c>>>1}return(c^-1)>>>0}function u16(d,o,n){d.setUint16(o,n,true)}function u32(d,o,n){d.setUint32(o,n>>>0,true)}function concat(parts){let n=parts.reduce((s,p)=>s+p.length,0),a=new Uint8Array(n),pos=0;for(const p of parts){a.set(p,pos);pos+=p.length}return a}function zipMake(files){const local=[],central=[];let offset=0;for(const f of files){const name=encoder.encode(f.name),body=f.bytes,crc=crc32(body),lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,8,0);u32(v,14,crc);u32(v,18,body.length);u32(v,22,body.length);u16(v,26,name.length);lh.set(name,30);local.push(lh,body);const ch=new Uint8Array(46+name.length),w=new DataView(ch.buffer);u32(w,0,0x02014b50);u16(w,4,20);u16(w,6,20);u32(w,16,crc);u32(w,20,body.length);u32(w,24,body.length);u16(w,28,name.length);u32(w,42,offset);ch.set(name,46);central.push(ch);offset+=lh.length+body.length}const cd=concat(central),end=new Uint8Array(22),v=new DataView(end.buffer);u32(v,0,0x06054b50);u16(v,8,files.length);u16(v,10,files.length);u32(v,12,cd.length);u32(v,16,offset);return new Blob([...local,cd,end],{type:'application/zip'})}function zipRead(buf){const b=new Uint8Array(buf),v=new DataView(buf),out=new Map();let end=-1;for(let i=b.length-22;i>=Math.max(0,b.length-65557);i--)if(v.getUint32(i,true)===0x06054b50){end=i;break}if(end<0)throw Error('找不到 ZIP 目錄');const count=v.getUint16(end+10,true);if(count>20000)throw Error('附件數量異常');let pos=v.getUint32(end+16,true);for(let i=0;i<count;i++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('ZIP 目錄錯誤');const method=v.getUint16(pos+10,true),crc=v.getUint32(pos+16,true),size=v.getUint32(pos+20,true),n=v.getUint16(pos+28,true),extra=v.getUint16(pos+30,true),comment=v.getUint16(pos+32,true),offset=v.getUint32(pos+42,true),name=decoder.decode(b.slice(pos+46,pos+46+n));if(method!== async function backupZIP(){try{const snapshot={version:1,created:new Date().toISOString(),stores:{}};for(const s of STORES)if(s!=='attachments')snapshot.stores[s]=await all(s);const atts=await all('attachments'),files=[];for(const a of atts){const name='attachments/'+a.id;files.push({name,bytes:new Uint8Array(await a.blob.arrayBuffer())})}snapshot.attachments=atts.map(({blob,...rest})=>rest);files.unshift({name:'records.json',bytes:encoder.encode(JSON.stringify(snapshot))});download(zipMake(files),'繳款稅務管理_完整備份_'+today()+'.zip');await put('meta',{id:'lastBackup',value:new Date().toISOString()});await refresh();alert('已啟動備份下載。請確認 ZIP 確實保存到裝置或雲端。')}catch(e){alert('備份失敗：'+e.message)}}
async function restoreZIP(){const f=$('#restoreFile')?.files?.[0];if(!f)return alert('請選擇 ZIP 檔');try{const zip=zipRead(await f.arrayBuffer()),json=zip.get('records.json');if(!json)throw Error('找不到 records.json');const snap=JSON.parse(decoder.decode(json));if(snap.version!==1)throw Error('不支援的備份版本');for(const s of STORES.filter(s=>s!=='attachments')){if(!Array.isArray(snap.stores?.[s]))throw Error('缺少資料表：'+s);const ids=new Set();for(const o of snap.stores[s]){if(!o||typeof o.id!=='string'||ids.has(o.id))throw Error('資料 ID 異常：'+s);ids.add(o.id)}}if(!Array.isArray(snap.attachments))throw Error('缺少附件清單');const att=[];for(const a of snap.attachments){const bytes=zip.get('attachments/'+a.id);if(!bytes||bytes.length!==a.size)throw Error('附件缺少或大小不符：'+a.name);att.push({...a,blob:new Blob([bytes],{type:a.type})})}const msg=`備份日期：${snap.created}\n交易 ${snap.stores.transactions.length} 筆，附件 ${att.length} 個。\n\n還原將完整取代現有資料。請先點「下載完整 ZIP 備份」並確認檔案已保存。`;if(!confirm(msg))return;if(!confirm('再次確認：你已完成現有資料的安全備份，並同意完整取代？'))return;await new Promise((resolve,reject)=>{const t=tx(STORES,'readwrite');for(const s of STORES){const store=t.objectStore(s);store.clear();const rows=s==='attachments'?att:snap.stores[s];for(const o of rows)store.put(o)}t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('容量不足，已取消還原'))});await refresh();alert('還原完成，資料已重新載入。')}catch(e){alert('還原未完成，原資料應保持不變：'+e.message)}}

const v21CardMonths=c=>c.frequency==='monthly'?Array.from({length:12},(_,i)=>i+1):c.frequency==='even'?[2,4,6,8,10,12]:[1,3,5,7,9,11];
function v21Dates(year,month,c){const end=monthDay(year,month,Number(c.endDay)||11);let sy=year,sm=month-Number(c.offset??1);while(sm<1){sm+=12;sy--}const start=c.frequency==='monthly'?dateAdd(end, -1,'month'):monthDay(sy,sm,Number(c.startDay)||12);return {start:c.frequency==='monthly'?dateAdd(monthDay(sy,sm,Number(c.endDay)||11),1,'day'):start,end};}

function v21NextDay(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+1);return d.toLocaleDateString('sv-SE')}
function v21CardDates(year,month,c){const end=monthDay(year,month,Number(c.endDay)||11);let sy=year,sm=month-Number(c.offset??1);while(sm<1){sm+=12;sy--}return {start:c.frequency==='monthly'?v21NextDay(monthDay(sy,sm,Number(c.endDay)||11)):monthDay(sy,sm,Number(c.startDay)||12),end}}
function v21Schedule(c){const y=new Date().getFullYear(),floor=dateAdd((c.createdAt||today()).slice(0,7)+'-01',-1,'month'),out=[];for(const year of [y-1,y,y+1])for(const month of v21CardMonths(c)){const dates=v21CardDates(year,month,c);if(dates.end<floor)continue;if(dates.start>dates.end)throw Error('消費期間起始日晚於截止日');out.push({year,month,...dates})}out.sort((a,b)=>a.start.localeCompare(b.start));for(let i=1;i<out.length;i++)if(out[i].start<=out[i-1].end)throw Error('消費期日期重疊，請修改起始日或截止日');return out}

saveCard=async function(f,key){const v=Object.fromEntries(new FormData(f)),old=data.cards.find(x=>x.id===key);const c={...(old||{id:id(),active:true,archived:false,createdAt:today()}),name:v.name.trim(),target:num(v.target),frequency:v.frequency,endDay:+v.endDay,offset:v.frequency==='monthly'?1:+v.offset,startDay:+v.startDay};if(!c.name||c.target<=0||c.endDay<1||c.endDay>28||c.startDay<1||c.startDay>28||c.offset<0||c.offset>2)return alert('請檢查名稱、金額及日期');try{v21Schedule(c)}catch(e){return alert(e.message)}if(old){const changes=['frequency','endDay','offset','startDay'].some(k=>old[k]!==c[k]);if(changes&&!confirm('設定已變更。儲存後請點選「重新產生消費期」，預覽並確認受影響的期數。既有交易不會被刪除。'))return;if(changes)c.needsRegeneration=true;await save('cards',c,'信用卡設定更正');if(old.target!==c.target){for(const period of items('cardPeriods','cardId',c.id).filter(p=>p.start>today()&&!v21Transactions(p.id).length)){period.target=c.target;await put('cardPeriods',period)}await refresh()}}else{await save('cards',c);await createCardPeriods(c)}closeDialog()};
function v21RegenerationPlan(cid){const c=data.cards.find(x=>x.id===cid),old=items('cardPeriods','cardId',cid),desired=v21Schedule(c),byEnd=new Map(desired.map(x=>[x.end,x])),remove=[],blocked=[],keep=[],add=[];for(const p of old){const wanted=byEnd.get(p.end);const same=wanted&&wanted.start===p.start;const hasTx=v21Transactions(p.id).length>0;if(same){keep.push(p);continue}if(hasTx){blocked.push(p);continue}remove.push(p)}for(const p of desired)if(!keep.some(x=>x.end===p.end&&x.start===p.start)&&!blocked.some(x=>x.end===p.end&&x.start===p.start))add.push(p);return {c,remove,blocked,keep,add}}

async function v21SaveInstallPlan(f,key){const v=Object.fromEntries(new FormData(f)),x=data.installments.find(a=>a.id===key),count=+v.count,total=num(v.total);if(!Number.isInteger(count)||count<1||count>360||total<1)return alert('金額或期數不正確');const old=x.periods,protectedPeriods=old.filter(p=>data.transactions.some(t=>t.parentType==='installment'&&t.parentId===p.id)||p.closed);if(protectedPeriods.some(p=>p.n>count))return alert('縮減期數會移除已有付款或結清的期數，無法修改');const protectedAmount=protectedPeriods.reduce((s,p)=>s+p.amount,0);if(total<protectedAmount)return alert('新總額小於已付款或結清期數的原應繳金額');const adjustable=Array.from({length:count},(_,i)=>i+1).filter(n=>!protectedPeriods.some(p=>p.n===n)),remaining=total-protectedAmount;if(!adjustable.length&&remaining!==0)return alert('所有期數已有交易，無法重新分配金額');const base=adjustable.length?Math.floor(remaining/adjustable.length):0;let k=0;const periods=Array.from({length:count},(_,i)=>{const n=i+1,prev=old[i];if(protectedPeriods.some(p=>p.n===n))return prev;const amount=base+(++k===adjustable.length?remaining-base*adjustable.length:0);return {...(prev||{id:id(),n,closed:false}),amount,due:dateAdd(v.start,i,v.cycle)}});if(!confirm(`將總金額改為 ${money(total)}，期數改為 ${count}；已有交易的期數保持原樣，其他期數重新計算。確定？`))return;const before={total:x.original,count:old.length};Object.assign(x,{name:v.name,original:total,cycle:v.cycle,note:v.note,periods});await save('installments',x,'分期計畫更正');await audit('installments',key,{action:'financial-correction',before,after:{total,count}});closeDialog()}

async function v21SaveTransaction(f,tid){const v=Object.fromEntries(new FormData(f)),t=data.transactions.find(x=>x.id===tid);if(t.status==='verified')return alert('此交易已核對，請先取消核對');const amount=num(v.amount);if(amount<=0)return alert('金額須大於零');if(t.type==='refund'&&t.originalId){const orig=data.transactions.find(x=>x.id===t.originalId),other=data.transactions.filter(x=>x.type==='refund'&&x.originalId===t.originalId&&x.id!==tid).reduce((s,x)=>s+x.amount,0);if(!orig||amount+other>orig.amount)return alert('退款超過原始金額')}if(t.type!=='refund'){const refunds=data.transactions.filter(x=>x.type==='refund'&&x.originalId===tid).reduce((s,x)=>s+x.amount,0);if(amount<refunds)return alert('更正金額不可低於已退款金額')}if(t.parentType==='card'&&t.type==='spend'){const p=data.cardPeriods.find(x=>x.id===t.parentId);if(v.date<p.start||v.date>p.end)return alert('新日期不在原消費期內，請先檢查交易歸屬')}const before={date:t.date,amount:t.amount};if(!confirm(`交易金額 ${money(t.amount)} → ${money(amount)}，確定更正？`))return;Object.assign(t,{date:v.date,amount,note:v.note});await save('transactions',t,'交易更正');await audit('transactions',tid,{action:'correction',before,after:{date:t.date,amount:t.amount}});closeDialog()}

function v21PreviewArchive(){const g=v21ArchiveCandidates();showDialog('歷史封存預覽',`<p>共 ${g.length} 組符合初步條件。</p>${g.slice(0,80).map(x=>`<div class="item">${esc(x.kind)}｜${esc(x.label)}｜${x.transactions.length} 筆</div>`).join('')||noData('目前沒有可清理的舊交易')}`)}
async function v21ExportArchive(){const groups=v21ArchiveCandidates();if(!groups.length)return alert('沒有符合條件的歷史資料');const ts=groups.flatMap(x=>x.transactions),ids=new Set(ts.map(x=>x.id)),atts=data.attachments.filter(a=>ids.has(a.transactionId));const manifest={format:'payment-tax-history-v21',version:1,created:new Date().toISOString(),cutoff:dateAdd(today(),-24,'month'),groups:groups.map(({transactions,...x})=>({...x,transactionIds:transactions.map(t=>t.id)})),transactions:ts,attachments:atts.map(({blob,...rest})=>rest),reference:{installments:data.installments.filter(x=>groups.some(g=>g.kind==='installment'&&g.id===x.id)),taxBills:data.taxBills.filter(x=>groups.some(g=>g.kind==='tax'&&g.id===x.id)),cardPeriods:data.cardPeriods.filter(x=>groups.some(g=>g.kind==='card'&&g.id===x.id))}};const files=[{name:'history.json',bytes:encoder.encode(JSON.stringify(manifest))}];for(const a of atts)files.push({name:'attachments/'+a.id,bytes:new Uint8Array(await a.blob.arrayBuffer())});const blob=zipMake(files);const check=zipRead(await blob.arrayBuffer());const parsed=JSON.parse(decoder.decode(check.get('history.json')));if(parsed.transactions.length!==ts.length||atts.some(a=>!check.has('attachments/'+a.id)))return alert('封存驗證失敗');download(blob,'繳款稅務_歷史封存_'+today()+'.zip');v21ArchiveManifest={ids:ts.map(t=>t.id),attachmentIds:atts.map(a=>a.id),created:today(),signature:ts.map(t=>t.id).sort().join('|')};alert('已啟動封存 ZIP 下載。請至「檔案」App 確認檔案存在、可以解壓縮且資料完整。確認前請勿清理。')}
async function v21PurgeArchive(){if(!v21ArchiveManifest)return alert('請先在本次開啟 App 的期間匯出歷史封存 ZIP');const current=v21ArchiveCandidates(),ids=current.flatMap(g=>g.transactions.map(t=>t.id)).sort(),sig=ids.join('|');if(sig!==v21ArchiveManifest.signature)return alert('封存後資料已有變化，請重新匯出');if(!confirm('你是否已在「檔案」App 確認歷史封存 ZIP 存在且可開啟，並另外保存完整 ZIP 備份？'))return;if(!confirm(`將永久刪除 ${ids.length} 筆符合條件的舊交易及其附件。封存 ZIP 不可直接使用完整還原功能。確定繼續？`))return;const set=new Set(ids),atts=data.attachments.filter(a=>set.has(a.transactionId)),t=tx(['transactions','attachments','audit'],'readwrite');for(const k of ids)t.objectStore('transactions').delete(k);for(const a of atts)t.objectStore('attachments').delete(a.id);t.objectStore('audit').put({id:id(),kind:'historyCleanup',ref:'history',at:new Date().toISOString(),detail:{count:ids.length,attachments:atts.length,cutoff:dateAdd(today(),-24,'month')}});await new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});v21ArchiveManifest=null;await refresh();alert('歷史資料清理完成。請重新下載完整 ZIP 備份。')}
// Keep compact account balances after historical transactions are archived.
const v21OriginalPaid=paid,v21OriginalVerified=verified,v21OriginalCardEffective=cardEffective;
function v21Ledger(kind,ref){return data.meta.find(x=>x.id==='v21ledger:'+kind+':'+ref)||{paid:0,verified:0,effective:0}}
paid=function(kind,ref){return v21OriginalPaid(kind,ref)+v21Ledger(kind,ref).paid};
verified=function(kind,ref){return v21OriginalVerified(kind,ref)+v21Ledger(kind,ref).verified};
cardEffective=function(pid){return v21OriginalCardEffective(pid)+v21Ledger('card',pid).effective};
function v21LedgerDelta(ts){let paid=0,verified=0,effective=0;for(const t of ts){if(t.parentType==='card'){if(t.type==='spend'&&t.status==='verified')effective+=t.amount;if(t.type==='refund')effective-=t.amount}else{if(t.type==='payment'&&t.status!=='failed')paid+=t.amount;if(t.type==='refund')paid-=t.amount;if(t.type==='payment'&&t.status==='verified')verified+=t.amount;if(t.type==='refund'&&t.status==='verified')verified-=t.amount}}return {paid,verified,effective}}
// Only complete historical periods are eligible. Do not delete records required for an active refund workflow.
v21ArchiveCandidates=function(){const cutoff=dateAdd(today(),-24,'month'),groups=[];for(const m of data.installments){const refs=new Set((m.periods||[]).map(p=>p.id)),ts=data.transactions.filter(t=>t.parentType==='installment'&&refs.has(t.parentId));if(!m.archived||!ts.length||ts.some(t=>!t.date||t.date>=cutoff||t.status!=='verified')||m.periods.some(p=>!p.closed&&paid('installment',p.id)<p.amount))continue;groups.push({kind:'installment',id:m.id,label:m.name,transactions:ts})}for(const b of data.taxBills){const ts=data.transactions.filter(t=>t.parentType==='tax'&&t.parentId===b.id);if(!ts.length||ts.some(t=>!t.date||t.date>=cutoff||t.status!=='verified')||b.state==='cancelled'||(b.state!=='exempt'&&(b.amount==null||paid('tax',b.id)<b.amount)))continue;groups.push({kind:'tax',id:b.id,label:b.name,transactions:ts})}for(const p of data.cardPeriods){const ts=v21Transactions(p.id);if(!ts.length||p.end>=cutoff||ts.some(t=>!t.date||t.date>=cutoff||t.type==='spend'&&t.status==='pending'||t.type==='refund'&&t.status!=='verified'))continue;groups.push({kind:'card',id:p.id,label:p.start+'～'+p.end,transactions:ts})}return groups};
// Replace cleanup with atomic deletion + accounting summaries, preserving historical totals.
v21PurgeArchive=async function(){if(!v21ArchiveManifest)return alert('請先匯出歷史封存 ZIP');const groups=v21ArchiveCandidates(),ids=groups.flatMap(g=>g.transactions.map(t=>t.id)).sort();if(ids.join('|')!==v21ArchiveManifest.signature)return alert('封存後資料已有變化，請重新匯出');if(!confirm('請確認歷史封存 ZIP 已保存且可以解壓縮，並另外保存完整 ZIP 備份。確定已完成？'))return;if(!confirm(`永久清理 ${ids.length} 筆歷史交易與附件。系統會保留各期的累計帳務金額。確定？`))return;const idset=new Set(ids),atts=data.attachments.filter(a=>idset.has(a.transactionId)),summary=new Map();for(const g of groups)for(const t of g.transactions){const key=t.parentType+':'+t.parentId;if(!summary.has(key))summary.set(key,[]);summary.get(key).push(t)}const t=tx(['transactions','attachments','audit','meta'],'readwrite');for(const k of ids)t.objectStore('transactions').delete(k);for(const a of atts)t.objectStore('attachments').delete(a.id);for(const [key,arr] of summary){const [kind,ref]=key.split(':'),old=v21Ledger(kind,ref),delta=v21LedgerDelta(arr);t.objectStore('meta').put({id:'v21ledger:'+key,paid:old.paid+delta.paid,verified:old.verified+delta.verified,effective:old.effective+delta.effective})}t.objectStore('audit').put({id:id(),kind:'historyCleanup',ref:'history',at:new Date().toISOString(),detail:{count:ids.length,attachments:atts.length,cutoff:dateAdd(today(),-24,'month')}});await new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});v21ArchiveManifest=null;await refresh();alert('清理完成。帳務累計金額已保留。請立即下載新的完整 ZIP 備份。')};
function v21SelectArchive(){showDialog('還原歷史封存 ZIP',`<p>此功能將歷史交易及附件還原到現有資料庫，不會覆蓋相同 ID 的交易。</p><input id="v21ArchiveFile" type="file" accept=".zip,application/zip"><div class="actions">${btn('檢查並還原歷史', 'v21RestoreArchive()','primary')}</div>`)}
async function v21RestoreArchive(){const file=$('#v21ArchiveFile')?.files?.[0];if(!file)return alert('請選擇封存 ZIP');try{const zip=zipRead(await file.arrayBuffer()),raw=zip.get('history.json');if(!raw)throw Error('缺少 history.json');const a=JSON.parse(decoder.decode(raw));if(a.format!=='payment-tax-history-v21'||!Array.isArray(a.transactions)||!Array.isArray(a.attachments))throw Error('封存格式不正確');const oldIds=new Set(data.transactions.map(t=>t.id)),insert=a.transactions.filter(t=>!oldIds.has(t.id));if(insert.length!==a.transactions.length)throw Error('部分交易已存在，為避免重複計算，請勿重複還原');const attachmentIds=new Set(data.attachments.map(x=>x.id));const atts=[];for(const x of a.attachments){if(attachmentIds.has(x.id))throw Error('附件 ID 已存在');const bytes=zip.get('attachments/'+x.id);if(!bytes)throw Error('缺少附件 '+x.id);atts.push({...x,blob:new Blob([bytes],{type:x.type||'application/octet-stream'})})}const parentOK=t=>t.parentType==='installment'?data.installments.some(m=>(m.periods||[]).some(p=>p.id===t.parentId)):t.parentType==='tax'?data.taxBills.some(b=>b.id===t.parentId):t.parentType==='card'?data.cardPeriods.some(p=>p.id===t.parentId):false;if(insert.some(t=>!parentOK(t)))throw Error('部分原始主檔不存在，不能安全還原');if(!confirm(`將還原 ${insert.length} 筆歷史交易及 ${atts.length} 個附件，並調整累計帳務摘要。確定？`))return;const groups=new Map();for(const x of insert){const key=x.parentType+':'+x.parentId;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}for(const [key,arr] of groups){const [kind,ref]=key.split(':'),old=v21Ledger(kind,ref),d=v21LedgerDelta(arr);if(old.paid-d.paid<0&&kind!=='card'||old.verified-d.verified<0&&kind!=='card')throw Error('歷史摘要不足，不能還原，避免重複計算')}const t=tx(['transactions','attachments','meta','audit'],'readwrite');for(const x of insert)t.objectStore('transactions').put(x);for(const x of atts)t.objectStore('attachments').put(x);for(const [key,arr] of groups){const [kind,ref]=key.split(':'),old=v21Ledger(kind,ref),d=v21LedgerDelta(arr);t.objectStore('meta').put({id:'v21ledger:'+key,paid:old.paid-d.paid,verified:old.verified-d.verified,effective:old.effective-d.effective})}t.objectStore('audit').put({id:id(),kind:'historyRestore',ref:'history',at:new Date().toISOString(),detail:{count:insert.length}});await new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)});await refresh();closeDialog();alert('歷史封存還原完成。')}catch(e){alert('還原失敗：'+e.message)}}
const v21StorageOriginal=v21StorageView;v21StorageView=function(){return v21StorageOriginal()+card('歷史封存還原',`<p>從本系統匯出的 V2.1 歷史封存 ZIP，可在此檢查並還原。</p>${btn('選擇歷史封存 ZIP','v21SelectArchive()')}`)};
// V2.0 forms already pass a complete invocation; avoid appending a second (this).
formWrap=function(inner,handler){const call=handler.includes('(')?handler:handler+'(this)';return `<form onsubmit="event.preventDefault();${call}"><div class="fields">${inner}</div><div class="actions"><button class="primary" type="submit">儲存</button><button type="button" onclick="closeDialog()">取消</button></div></form>`};

async function init(){try{db=await openDB();for(const s of STORES)data[s]=await all(s);await ensureTaxYears();for(const c of data.cards.filter(x=>x.active&&!x.archived))await createCardPeriods(c);await refresh();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn)}catch(e){$('#view').innerHTML=`<div class="card">無法啟動本機資料庫：${esc(e.message)}。請使用 HTTPS 網址或 localhost 開啟。</div>`}}init();
</script></body></html>
